<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Quiz</title>
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    
    <main class="quiz">

        <section class="start-screen" id="startScreen">
            <span class="label">FRONTEND QUIZ</span>
            <h1>How well do you know <br>frontend</h1>
            <p>Test your knowledge of HTML,CSS and Javascript.

            </p>

            <button id="startBtn">Start Quiz</button>
        </section>

        <section class="quiz-screen" id="quizScreen">
            <div class="quiz-top">
                <span id="questionNumber">Question 1 of 10</span>
                
                <span id="score">Score:0</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="question">
                <span class="label">QUESTION</span>
                <h2 id="questionText"></h2>
            </div>

            <div class="options" id="options"></div>

            <button class="next-btn" id="nextBtn">
                Next Question
            </button>
        </section>

        <section class="result-screen" id="resultScreen">
            <span class="label">QUIZ COMPLETE</span>
            <h1 id="resultTitle">Nice Work</h1>

            <div class="result-score">
                <strong id="finalScore">0/10</strong>
                <span id="percentage">0%</span>
            </div>

            <p id="resultMessage"></p>

            <button id="restartBtn">Play Again</button>
        </section>

    </main>
<script src="quiz.js"></script>
</body>
</html>
